- hosts: webservers
  become: yes
  tasks:
    - name: Ensure Docker is installed (Amazon Linux 2023)
      dnf:
        name: docker
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Run Nginx test container
      docker_container:
        name: automated-web
        image: nginx:latest
        state: started
        published_ports:
          - "80:80"

    - name: Install Amazon CloudWatch Agent
      dnf:
        name: amazon-cloudwatch-agent
        state: present

    - name: Ensure CloudWatch configuration directory exists
      file:
        path: /opt/aws/amazon-cloudwatch-agent/etc
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Copy CloudWatch configuration file
      copy:
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        content: |
          {
            "agent": {
              "run_as_user": "root"
            },
            "metrics": {
              "metrics_collected": {
                "cpu": {
                  "measurement": [
                    "cpu_usage_idle",
                    "cpu_usage_user",
                    "cpu_usage_system"
                  ],
                  "metrics_collection_interval": 60
                },
                "mem": {
                  "measurement": [
                    "mem_used_percent"
                  ],
                  "metrics_collection_interval": 60
                }
              }
            }
          }
        owner: root
        group: root
        mode: '0644'

    - name: Start and enable CloudWatch agent via control tool
      shell: |
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
          -a fetch-config -m ec2 \
          -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
      args:
        creates: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.toml
